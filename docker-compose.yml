services:
  backend:
    build: ./backend
    container_name: docquery-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      DDB_TABLE: ${DDB_TABLE}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on: []
  frontend:
    build: ./frontend
    container_name: docquery-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NODE_ENV: production
    depends_on:
      - backend
